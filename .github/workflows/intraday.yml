name: intraday
on:
  schedule:
    - cron: '*/20 7-12 * * 0-4'
    - cron: '*/20 13-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pro-data
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --upgrade yfinance
      - run: python scripts/fetch_pro.py --intraday
      - name: Commit
        run: |
          git config user.name "shaibanor"
          git config user.email "shaibanor@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --mixed origin/main
            git add pro/live pro/live_status.json
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -qm "تحديث الأسعار اللحظية"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
