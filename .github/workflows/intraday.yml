name: intraday
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pro-data
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --upgrade yfinance
      - name: Live prices (stocks during their sessions, crypto always)
        run: |
          H=$(date -u +%H); D=$(date -u +%u)   # 1=Mon .. 7=Sun
          SA=0; US=0
          if [ "$D" = 7 ] || [ "$D" -le 4 ]; then [ "$H" -ge 7 ] && [ "$H" -le 12 ] && SA=1; fi
          if [ "$D" -le 5 ]; then [ "$H" -ge 13 ] && [ "$H" -le 20 ] && US=1; fi
          if [ "$SA" = 1 ] || [ "$US" = 1 ]; then python scripts/fetch_pro.py --intraday; else python scripts/fetch_pro.py --intraday --crypto-only; fi
          if [ "$SA" = 1 ] || [ "$US" = 1 ]; then python scripts/ext_radar.py || true; fi
      - name: Commit
        run: |
          git config user.name "shaibanor"
          git config user.email "shaibanor@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --mixed origin/main
            git add pro/live pro/live_status.json pro/summary.json $(ls pro/ext_radar.json 2>/dev/null)
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -qm "تحديث الأسعار اللحظية"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
