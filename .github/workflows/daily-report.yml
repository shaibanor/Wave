name: daily-report
on:
  schedule:
    - cron: '50 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Monitoring cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin qa:refs/remotes/origin/qa || true
          python3 scripts/daily_report.py
      - name: Save automatic fixes
        run: |
          git config user.name "shaibanor"
          git config user.email "shaibanor@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -qm "Monitor: resync candles" && git pull -q --rebase && git push -q)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Render PDF
        run: |
          sudo apt-get install -y -qq fonts-noto-core >/dev/null
          mkdir -p /tmp/pdf && cd /tmp/pdf && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > render.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();await p.goto('file://'+process.argv[2]);await p.waitForTimeout(600);await p.pdf({path:process.argv[3],format:'A4',printBackground:true});await b.close();})();
          JS
          node render.js "$GITHUB_WORKSPACE/out/report.html" "$GITHUB_WORKSPACE/out/report.pdf"
      - name: Publish to reports branch
        run: |
          D=$(TZ=Asia/Riyadh date +%Y-%m-%d)
          mkdir -p /tmp/rep && cd /tmp/rep
          git init -q && git config user.name "shaibanor" && git config user.email "shaibanor@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          if git fetch -q origin reports; then git checkout -q -b reports FETCH_HEAD; else git checkout -q --orphan reports; fi
          cp "$GITHUB_WORKSPACE/out/report.pdf" "report-$D.pdf"
          cp "$GITHUB_WORKSPACE/out/report.pdf" latest.pdf
          cp "$GITHUB_WORKSPACE/out/report.json" latest.json
          ls report-*.pdf | sort | head -n -45 | xargs -r rm -f
          git add -A && git commit -qm "report $D" && git push -q origin reports
