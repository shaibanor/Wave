name: resync
# The daily publish from the private dashboard replaces data.json with its 13 assets.
# Right after any push that touches data.json, put back the daily candles of every asset from pro/.
on:
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pro-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_candles.py
      - run: python3 scripts/validate.py
      - name: Commit
        run: |
          git config user.name shaibanor
          git config user.email shaibanor@users.noreply.github.com
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -qm "تحديث الشموع اليومية"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done; exit 1
