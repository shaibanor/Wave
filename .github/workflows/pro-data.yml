name: pro-data
on:
  schedule:
    - cron: '40 12 * * 0-4'
    - cron: '20 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_pro.py', '.github/workflows/pro-data.yml']
permissions:
  contents: write
concurrency:
  group: pro-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --upgrade yfinance
      - run: python scripts/fetch_pro.py
      - run: python scripts/sync_candles.py
      - run: pip install --quiet cryptography
      - run: python scripts/paper.py
      - name: Commit
        run: |
          git config user.name "shaibanor"
          git config user.email "shaibanor@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --mixed origin/main
            # only the generated data (never site code or rules, which may be newer on main than this checkout)
            git add -- $(ls -d pro/sa pro/us pro/cx pro/ix pro/live pro/summary.json pro/news.json pro/mnews.json pro/status.json pro/live_status.json vault/book.json data.json 2>/dev/null)
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -qm "تحديث بيانات المنصة المتقدمة"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
