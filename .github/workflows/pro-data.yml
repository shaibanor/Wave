name: pro-data
on:
  schedule:
    - cron: '40 12 * * 0-4'
    - cron: '20 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch_pro.py', '.github/workflows/pro-data.yml']
permissions:
  contents: write
concurrency:
  group: pro-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet --upgrade yfinance
      - run: python scripts/fetch_pro.py
      - name: Commit
        run: |
          git config user.name "shaibanor"
          git config user.email "shaibanor@users.noreply.github.com"
          git add pro
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "تحديث بيانات المنصة المتقدمة"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
