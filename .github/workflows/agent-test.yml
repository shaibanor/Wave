name: agent-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          mkdir -p /tmp/qa && cd /tmp/qa && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null || npx playwright install chromium >/dev/null
      - name: Talk to the agent on the live site
        run: |
          export GATE_HASH=$(grep -o "var H='[0-9a-f]*'" index.html | head -1 | cut -d"'" -f2)
          NODE_PATH=/tmp/qa/node_modules node scripts/agent_live.js
