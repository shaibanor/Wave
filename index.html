<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>مغلق للإصلاحات</title>
<style>
:root{--bg:#0b0f17;--card:#121826;--line:#232c3d;--tx:#e8ecf3;--mut:#8a94a8;--acc:#e9cf8f}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--line:#e3e6ec;--tx:#141a26;--mut:#5d6678;--acc:#a8842f}}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Geeza Pro",Arial,sans-serif;padding:16px}
main{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:44px 28px;text-align:center}
svg{width:56px;height:56px;color:var(--acc);margin-bottom:22px}
h1{font-size:1.6rem;font-weight:700;margin-bottom:12px}
p{color:var(--mut);font-size:1.05rem;line-height:1.8}
</style>
</head>
<body>
<main id="maint">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.6 17.4a1.4 1.4 0 0 0 2 2l5.7-5.7a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-.5-.5-2z"/></svg>
<h1>مغلق للإصلاحات</h1>
<p>حاول في وقت لاحق</p>
</main>
</body>
</html>
